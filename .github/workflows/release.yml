name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Bump VERSION before the next release." >&2
            exit 1
          fi

      - name: Download verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          rm -rf dist
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name RASPORED-android --dir dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name RASPORED-web --dir dist

          test -s dist/RASPORED.apk
          test -s dist/RASPORED.aab
          test -s dist/raspored_demo.apk
          WEB_ZIP="$(find dist -maxdepth 1 -type f -name 'RASPORED-web-v*.zip' -print -quit)"
          test -n "$WEB_ZIP"
          test -s "$WEB_ZIP"

          unzip -tq dist/RASPORED.apk
          unzip -tq dist/RASPORED.aab
          unzip -tq dist/raspored_demo.apk
          unzip -tq "$WEB_ZIP"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android clean-install and upgrade smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-build: 15917651
          disable-animations: true
          script: |
            set -eu
            VERSION="${{ steps.version.outputs.version }}"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose dist/RASPORED.apk
            "$APKSIGNER" verify --verbose dist/raspored_demo.apk

            # v1.0.29 establishes the stable GitHub signing baseline. From the
            # following release onward, verify a real in-place APK upgrade.
            if [[ "$VERSION" != "1.0.29" ]]; then
              PREVIOUS_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
              test -n "$PREVIOUS_TAG"
              rm -rf "${RUNNER_TEMP}/previous-release"
              mkdir -p "${RUNNER_TEMP}/previous-release"
              gh release download "$PREVIOUS_TAG"                 --repo "$GITHUB_REPOSITORY"                 --pattern RASPORED.apk                 --dir "${RUNNER_TEMP}/previous-release"

              adb uninstall hr.raspored.app >/dev/null 2>&1 || true
              adb install "${RUNNER_TEMP}/previous-release/RASPORED.apk"
              adb install -r dist/RASPORED.apk
              adb shell am force-stop hr.raspored.app
              adb shell monkey -p hr.raspored.app -c android.intent.category.LAUNCHER 1 >/dev/null
              adb shell pidof hr.raspored.app
              adb shell dumpsys package hr.raspored.app | grep -F "versionName=$VERSION"
            fi

            adb uninstall hr.raspored.app >/dev/null 2>&1 || true
            adb uninstall hr.raspored.demo >/dev/null 2>&1 || true

            adb install dist/RASPORED.apk
            adb install dist/raspored_demo.apk

            adb shell am force-stop hr.raspored.app
            adb shell monkey -p hr.raspored.app -c android.intent.category.LAUNCHER 1 >/dev/null
            adb shell pidof hr.raspored.app
            adb shell dumpsys package hr.raspored.app | grep -F "versionName=$VERSION"

            adb shell am force-stop hr.raspored.demo
            adb shell monkey -p hr.raspored.demo -c android.intent.category.LAUNCHER 1 >/dev/null
            adb shell pidof hr.raspored.demo
            adb shell dumpsys package hr.raspored.demo | grep -F "versionName=$VERSION"

      - name: Package and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          WEB_ZIP="$(find dist -maxdepth 1 -type f -name "RASPORED-web-v${VERSION}.zip" -print -quit)"
          test -n "$WEB_ZIP"

          (
            cd dist
            sha256sum RASPORED.apk RASPORED.aab raspored_demo.apk "RASPORED-web-v${VERSION}.zip" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"

          gh release create "v${VERSION}"             dist/RASPORED.apk             dist/RASPORED.aab             dist/raspored_demo.apk             "dist/RASPORED-web-v${VERSION}.zip"             dist/SHA256SUMS             --target "$RELEASE_SHA"             --title "Takto v${VERSION}"             --notes "Takto Android i Web/PWA izdanje. GitHub APK se prije objave provjerava kroz stvarni clean-install i launch smoke test. Od v1.0.29 glavni CI koristi stabilni GitHub-distribution signing identitet kako bi buduće GitHub APK nadogradnje zadržale isti potpis. Prijelaz sa starijih izdanja koja su mogla biti potpisana drugim automatskim debug certifikatom može jednom zahtijevati uklanjanje stare Takto instalacije. AAB je release bundle za daljnju obradu i nije namijenjen izravnoj instalaciji."

      - uses: actions/upload-artifact@v4
        with:
          name: raspored-v${{ steps.version.outputs.version }}
          path: |
            dist/RASPORED.apk
            dist/RASPORED.aab
            dist/raspored_demo.apk
            dist/RASPORED-web-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
