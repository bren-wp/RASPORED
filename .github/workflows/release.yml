name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Bump VERSION before the next release." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing required GitHub Secret: $name" >&2; exit 1; }
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/raspored-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RASPORED_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RASPORED_RELEASE_STORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RASPORED_RELEASE_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RASPORED_RELEASE_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Android QA and signed release artifacts
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:lintRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RASPORED.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/RASPORED.aab
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/RASPORED.apk
          jarsigner -verify -strict -certs dist/RASPORED.aab

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace

      - name: Web QA
        working-directory: web
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
          find public/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('public/assets/data/payroll-public-sector-2026.json','utf8'))"
          npm install
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke.spec.ts tests/capture.spec.ts tests/export-history.spec.ts tests/ocr-parser.spec.ts

      - name: Package Web/PWA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist/web-package
          mkdir -p dist/web-package/storage/data
          cp -R web/public/. dist/web-package/
          cp web/storage/.htaccess dist/web-package/storage/.htaccess
          printf '%s\\n' '# Runtime JSON files are created here.' > dist/web-package/storage/data/.gitkeep
          (
            cd dist/web-package
            zip -r "../RASPORED-web-v${VERSION}.zip" . \
              -x "*.DS_Store" \
              -x "__MACOSX/*" \
              -x "storage/data/client-*.json" \
              -x "storage/data/.write.lock"
          )
          sha256sum dist/RASPORED.apk dist/RASPORED.aab "dist/RASPORED-web-v${VERSION}.zip" > dist/SHA256SUMS
          test -s dist/RASPORED.apk
          test -s dist/RASPORED.aab
          test -s "dist/RASPORED-web-v${VERSION}.zip"
          test -s dist/SHA256SUMS
          unzip -tq dist/RASPORED.apk
          unzip -tq dist/RASPORED.aab
          unzip -tq "dist/RASPORED-web-v${VERSION}.zip"
          sha256sum -c dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          gh release create "v${VERSION}" \
            dist/RASPORED.apk \
            dist/RASPORED.aab \
            "dist/RASPORED-web-v${VERSION}.zip" \
            dist/SHA256SUMS \
            --target "$RELEASE_SHA" \
            --title "RASPORED v${VERSION}" \
            --notes "Produkcijsko izdanje RASPORED-a. Sadrži release-potpisani Android APK, upload-potpisani AAB za Play Console i Web/PWA paket. Android ključevi dolaze isključivo iz GitHub Secrets i nisu dio repozitorija ni release artefakata. Prije objave workflow provjerava potpise, ZIP integritet i SHA-256 kontrolne vrijednosti."

      - uses: actions/upload-artifact@v4
        with:
          name: raspored-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
