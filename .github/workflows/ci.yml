name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          grep -q "\"version\":\"$VERSION\"" web/package.json || { echo "web/package.json version differs from VERSION"; exit 1; }
          grep -q "^$VERSION$" web/public/version.txt || { echo "web/public/version.txt differs from VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump VERSION before merging new changes." >&2
            exit 1
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: PHP syntax
        run: php -l public/index.php
      - name: Install QA dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and screenshot QA
        run: npx playwright test tests/capture.spec.ts tests/smoke.spec.ts
      - name: Package Web/PWA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist
          (
            cd public
            zip -r "../../dist/RASPORED-web-v${VERSION}.zip" . -x "*.DS_Store" -x "__MACOSX/*"
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-captures
          path: web/test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-web
          path: dist/RASPORED-web-*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android debug build
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --stacktrace
      - name: Prepare installable APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RASPORED.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-apk
          path: dist/RASPORED.apk
          if-no-files-found: error

  android-ui:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android launch and navigation smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace
