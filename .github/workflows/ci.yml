name: CI
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          grep -q "\"version\":\"$VERSION\"" web/package.json || { echo "web/package.json version differs from VERSION"; exit 1; }
          grep -q "^$VERSION$" web/public/version.txt || { echo "web/public/version.txt differs from VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump VERSION before merging new changes." >&2
            exit 1
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: PHP syntax
        run: php -l public/index.php
      - name: Install QA dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and screenshot QA
        run: npx playwright test tests/capture.spec.ts tests/smoke.spec.ts
      - name: Refresh real README screenshots and PWA PNG icons
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feat/production-finalization'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raspored-media
          cp test-results/capture-capture-home-desktop-1440/home.png /tmp/raspored-media/app-home-desktop.png
          cp test-results/capture-capture-home-mobile-390/home.png /tmp/raspored-media/app-home-mobile.png
          cp test-results/capture-capture-scan-mobile-390/scan.png /tmp/raspored-media/app-scan-mobile.png
          cp test-results/capture-capture-stats-desktop-1440/stats.png /tmp/raspored-media/app-stats-desktop.png
          cp test-results/capture-capture-hours-mobile-390/hours.png /tmp/raspored-media/app-hours-mobile.png
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
          fi
          rsvg-convert -w 192 -h 192 public/assets/brand/logo.svg > /tmp/raspored-media/icon-192.png
          rsvg-convert -w 512 -h 512 public/assets/brand/logo.svg > /tmp/raspored-media/icon-512.png
          rsvg-convert -w 192 -h 192 public/assets/brand/icon-maskable.svg > /tmp/raspored-media/icon-maskable-192.png
          rsvg-convert -w 512 -h 512 public/assets/brand/icon-maskable.svg > /tmp/raspored-media/icon-maskable-512.png
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          mkdir -p ../docs/media public/assets/brand
          cp /tmp/raspored-media/app-*.png ../docs/media/
          cp /tmp/raspored-media/icon-*.png public/assets/brand/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/media/app-*.png public/assets/brand/icon-*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh real app screenshots and PWA icons"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Package Web/PWA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist
          (
            cd public
            zip -r "../../dist/RASPORED-web-v${VERSION}.zip" . -x "*.DS_Store" -x "__MACOSX/*"
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-captures
          path: web/test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-web
          path: dist/RASPORED-web-*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android debug build
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --stacktrace
      - name: Prepare installable APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RASPORED.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-apk
          path: dist/RASPORED.apk
          if-no-files-found: error

  android-ui:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android launch and navigation smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace
