name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          grep -q "\"version\":\"$VERSION\"" web/package.json || { echo "web/package.json version differs from VERSION"; exit 1; }
          grep -q "^$VERSION$" web/public/version.txt || { echo "web/public/version.txt differs from VERSION"; exit 1; }
          grep -Fq "const CACHE=\"raspored-v$VERSION\";" web/public/sw.js || { echo "PWA cache version differs from VERSION"; exit 1; }
          grep -Fq "\$version = '$VERSION';" web/public/includes/bootstrap.php || { echo "Web bootstrap fallback version differs from VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump VERSION before merging new changes." >&2
            exit 1
          fi

      - name: Validate workflow syntax and release structure
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.parse_file(file) }'
          RELEASE=".github/workflows/release.yml"
          [[ "$(grep -c 'name: Create GitHub release' "$RELEASE")" -eq 1 ]] || { echo "release.yml must contain exactly one GitHub release step"; exit 1; }
          [[ "$(grep -c 'name: Android launch smoke test' "$RELEASE")" -eq 1 ]] || { echo "release.yml contains duplicate Android smoke-test steps"; exit 1; }
          [[ "$(grep -c 'name: Web QA' "$RELEASE")" -eq 1 ]] || { echo "release.yml contains duplicate Web QA steps"; exit 1; }
          [[ "$(grep -c 'name: Package and verify release artifacts' "$RELEASE")" -eq 1 ]] || { echo "release.yml must contain exactly one package/verify step"; exit 1; }

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: PHP and JavaScript syntax
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
          find public/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('public/assets/data/payroll-public-sector-2026.json','utf8'))"
      - name: Install QA dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and screenshot QA
        run: npx playwright test tests/capture.spec.ts tests/smoke.spec.ts tests/export-history.spec.ts tests/ocr-parser.spec.ts
      - name: Package Web/PWA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          rm -rf ../dist/web-package
          mkdir -p ../dist/web-package/storage/data
          cp -R public/. ../dist/web-package/
          cp storage/.htaccess ../dist/web-package/storage/.htaccess
          printf '%s\\n' '# Runtime JSON files are created here.' > ../dist/web-package/storage/data/.gitkeep
          (
            cd ../dist/web-package
            zip -r "../RASPORED-web-v${VERSION}.zip" . \
              -x "*.DS_Store" \
              -x "__MACOSX/*" \
              -x "storage/data/client-*.json" \
              -x "storage/data/.write.lock"
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-captures
          path: web/test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-web
          path: dist/RASPORED-web-*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Android debug build
        run: gradle -p android :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:lintRelease --stacktrace
      - name: Prepare installable APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RASPORED.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/RASPORED.aab
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RASPORED-android
          path: |
            dist/RASPORED.apk
            dist/RASPORED.aab
          if-no-files-found: error

  artifact-verify:
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: RASPORED-*
          path: dist
          merge-multiple: true
      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/RASPORED.apk
          test -s dist/RASPORED.aab
          WEB_ZIP="$(find dist -maxdepth 1 -type f -name 'RASPORED-web-v*.zip' -print -quit)"
          test -n "$WEB_ZIP"
          test -s "$WEB_ZIP"
          unzip -tq dist/RASPORED.apk
          unzip -tq dist/RASPORED.aab
          unzip -tq "$WEB_ZIP"
          sha256sum dist/RASPORED.apk dist/RASPORED.aab "$WEB_ZIP"

  android-ui:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android launch and navigation smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-build: 15917651
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace
