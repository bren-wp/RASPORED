name: CI
permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: PHP syntax
        run: php -l public/index.php
      - name: Install QA dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and screenshot QA
        run: npx playwright test tests/capture.spec.ts tests/smoke.spec.ts
      - name: Commit real README screenshots
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/marketing-readme-real-media'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          mkdir -p ../docs/media
          cp test-results/capture-capture-home-desktop-1440/home.png ../docs/media/app-home-desktop.png
          cp test-results/capture-capture-home-mobile-390/home.png ../docs/media/app-home-mobile.png
          cp test-results/capture-capture-scan-mobile-390/scan.png ../docs/media/app-scan-mobile.png
          cp test-results/capture-capture-stats-desktop-1440/stats.png ../docs/media/app-stats-desktop.png
          cp test-results/capture-capture-hours-mobile-390/hours.png ../docs/media/app-hours-mobile.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/media/app-*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add real application screenshots from CI"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-captures
          path: web/test-results
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android debug build
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
